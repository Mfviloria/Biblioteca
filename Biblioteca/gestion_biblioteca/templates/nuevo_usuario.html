<!DOCTYPE html>
<html lang="es">
<head>
    <title>Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>input, select { class: form-control; width: 100%; padding: 8px; margin-bottom: 15px; }</style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm col-md-6 offset-md-3">
        <div class="card-header bg-success text-white"><h5>Registrar Nuevo Usuario</h5></div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Registrar</button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
