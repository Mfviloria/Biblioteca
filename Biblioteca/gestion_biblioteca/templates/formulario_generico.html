<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --vintage-bg: #f4ecdf;
            --vintage-card: #fffaf0;
            --vintage-dark: #3b2f2f;
            --vintage-accent: #8b5a2b;
            --vintage-gold: #c5a059;
            --vintage-border: #d4c3b3;
        }
        body {
            background-color: var(--vintage-bg);
            color: var(--vintage-dark);
            font-family: 'Lora', serif;
        }
        h1, h2, h3, h4, h5, .card-header {
            font-family: 'Cinzel', serif;
        }
        .vintage-card {
            background-color: var(--vintage-card);
            border: 1px solid var(--vintage-border);
            box-shadow: 4px 6px 15px rgba(43, 29, 17, 0.1);
        }
        .card-header-vintage {
            background-color: #2b1d11 !important;
            color: #fdf6e2;
            border-bottom: 2px solid var(--vintage-gold);
        }
        input, select, textarea {
            background-color: #fff !important;
            border: 1px solid var(--vintage-border) !important;
            border-radius: 4px !important;
            padding: 8px 12px !important;
            width: 100%;
            margin-bottom: 15px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--vintage-accent) !important;
            box-shadow: 0 0 5px rgba(139, 90, 43, 0.3) !important;
            outline: none;
        }
        .btn-vintage {
            background-color: var(--vintage-accent);
            color: #fff;
            font-family: 'Cinzel', serif;
            border: none;
        }
        .btn-vintage:hover {
            background-color: #6e4520;
            color: #fff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 30px 0;">
<div class="container col-md-6">
    <div class="card vintage-card">
        <div class="card-header card-header-vintage py-3">
            <h4 class="mb-0 text-center"><i class="bi bi-journal-plus text-warning"></i> {{ titulo }}</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <hr class="border-secondary my-4">
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
                    <button type="submit" class="btn btn-vintage px-4">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
